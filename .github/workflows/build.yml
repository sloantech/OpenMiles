name: Build APK

# Runs every time you upload changes, and any time you press "Run workflow".
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the app
        run: ./gradlew assembleDebug --stacktrace

      - name: Save the installable file
        uses: actions/upload-artifact@v4
        with:
          name: OpenMiles-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
