name: Build APK

# Runs every time you upload changes, and any time you press "Run workflow".
on:
  push:
  pull_request:
  workflow_dispatch:

# The build only needs to read the code. It gets no other permissions.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Check the Gradle wrapper file is the genuine one
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run the tests, the code checker, and build the app
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Confirm the tests really ran
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total = failed = skipped = 0
          for f in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              r = ET.parse(f).getroot()
              total += int(r.get("tests", 0))
              failed += int(r.get("failures", 0)) + int(r.get("errors", 0))
              skipped += int(r.get("skipped", 0))
          print(f"Tests run: {total}, failed: {failed}, skipped: {skipped}")
          if total < 20 or failed or skipped:
              raise SystemExit("Tests did not all run and pass")
          PY

      - name: Privacy check - the app must not have internet access
        run: |
          M=$(find app/build -path '*merged_manifests*' -name AndroidManifest.xml | grep -i debug | head -1)
          if [ -z "$M" ]; then echo "Could not find the merged manifest"; exit 1; fi
          echo "Checking $M"
          echo "Permissions the app asks for:"
          grep -o 'uses-permission[^>]*android:name="[^"]*"' "$M" | grep -o 'android:name="[^"]*"' | sort -u
          if grep -q 'android.permission.INTERNET' "$M"; then
            echo "FAIL: the app asks for internet access"
            exit 1
          fi
          echo "OK: no internet permission"

      - name: Dependency security scan (known vulnerabilities, OSV database)
        run: |
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath > deps.txt
          python3 - <<'PY'
          import json, re, urllib.request
          pat = re.compile(r"([\w.\-]+):([\w.\-]+)(?::([\w.\-]+))?(?: -> ([\w.\-]+))?")
          found = {}
          for line in open("deps.txt"):
              if "---" not in line or "project :" in line:
                  continue
              m = pat.search(line.split("---", 1)[1])
              if not m:
                  continue
              group, art, declared, resolved = m.groups()
              version = resolved or declared
              if version:
                  found[(group, art, version)] = 1
          deps = sorted(found)
          print(f"Dependencies checked: {len(deps)}")
          if len(deps) < 20:
              raise SystemExit("Too few dependencies found. The scan did not read the list correctly.")
          queries = [{"package": {"name": f"{g}:{a}", "ecosystem": "Maven"}, "version": v} for g, a, v in deps]
          req = urllib.request.Request(
              "https://api.osv.dev/v1/querybatch",
              data=json.dumps({"queries": queries}).encode(),
              headers={"Content-Type": "application/json"},
          )
          results = json.load(urllib.request.urlopen(req, timeout=60))["results"]
          bad = [(d, r["vulns"]) for d, r in zip(deps, results) if r.get("vulns")]
          for (g, a, v), vulns in bad:
              print(f"VULNERABLE: {g}:{a}:{v} -> " + ", ".join(x["id"] for x in vulns))
          if bad:
              raise SystemExit(f"{len(bad)} dependencies have known vulnerabilities")
          print("OK: no known vulnerabilities in the dependency list")
          PY

      - name: Save the installable file
        uses: actions/upload-artifact@v4
        with:
          name: OpenMiles-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Save the test and code-check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
